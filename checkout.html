<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Varaq</title>
  <meta name="description" content="">
  <meta name="theme-color" content="#f7f5f0">
  <link rel="icon" href="assets/brand/varaq-favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Roboto+Slab:wght@500;600;700&display=swap">
  <!-- Apply the saved theme before the page is drawn, so it never flashes. -->
  <script>
    window.APP_NS = "bookstore";
    try {
      var savedTheme = localStorage.getItem("bookstore:theme");
      document.documentElement.setAttribute("data-theme", savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <script defer src="js/core.js"></script>
  <script defer src="js/lang.js"></script>
  <script defer src="js/books.js"></script>
  <script defer src="js/shop.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/pages/checkout.js"></script>
</head>
<body data-page="checkout">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1" class="container page">
    <h1 data-i18n="page.checkout"></h1>

    <div id="coEmpty" class="empty" hidden>
      <h2 data-i18n="co.empty"></h2>
      <a class="btn" href="catalog.html" data-i18n="home.browse"></a>
    </div>

    <div id="coFull" class="checkout-layout" hidden>
      <form id="coForm" class="co-form" novalidate>
        <div id="errorSummary" class="error-summary" role="alert" tabindex="-1" hidden></div>

        <fieldset class="co-section">
          <legend><span class="step-no" aria-hidden="true">01</span><span data-i18n="co.contact"></span></legend>
          <div class="field">
            <label for="name" data-i18n="co.name"></label>
            <input id="name" name="name" class="input" autocomplete="name" maxlength="60" aria-describedby="name-err">
            <p id="name-err" class="field-error"></p>
          </div>
          <div class="field">
            <label for="phone" data-i18n="co.phone"></label>
            <input id="phone" name="phone" type="tel" class="input" autocomplete="tel" inputmode="tel" placeholder="+998 90 123 45 67" aria-describedby="phone-hint phone-err">
            <p id="phone-hint" class="hint" data-i18n="co.phoneHint"></p>
            <p id="phone-err" class="field-error"></p>
          </div>
          <div class="field">
            <label for="email" data-i18n="co.email"></label>
            <input id="email" name="email" type="email" class="input" autocomplete="email" aria-describedby="email-err">
            <p id="email-err" class="field-error"></p>
          </div>
        </fieldset>

        <fieldset class="co-section">
          <legend><span class="step-no" aria-hidden="true">02</span><span data-i18n="co.delivery"></span></legend>
          <div class="field">
            <label for="region" data-i18n="co.region"></label>
            <select id="region" name="region" class="select" autocomplete="address-level1" aria-describedby="region-err"></select>
            <p id="region-err" class="field-error"></p>
          </div>

          <fieldset class="radio-group">
            <legend data-i18n="co.method"></legend>
            <label class="radio-card">
              <input type="radio" name="method" value="courier" checked>
              <span class="rc-main"><span class="rc-name" data-i18n="co.m.courier"></span><span class="hint" data-i18n="co.m.courierNote"></span></span>
              <span class="rc-price" id="price-courier"></span>
            </label>
            <label class="radio-card">
              <input type="radio" name="method" value="pickup" aria-describedby="pickupNote">
              <span class="rc-main"><span class="rc-name" data-i18n="co.m.pickup"></span><span class="hint" data-i18n="co.m.pickupNote"></span></span>
              <span class="rc-price" id="price-pickup"></span>
            </label>
            <label class="radio-card">
              <input type="radio" name="method" value="post">
              <span class="rc-main"><span class="rc-name" data-i18n="co.m.post"></span><span class="hint" data-i18n="co.m.postNote"></span></span>
              <span class="rc-price" id="price-post"></span>
            </label>
            <p id="pickupNote" class="hint" hidden data-i18n="co.pickupOnly"></p>
          </fieldset>

          <div class="field" id="addressField">
            <label for="address" data-i18n="co.address"></label>
            <textarea id="address" name="address" class="input" rows="2" maxlength="200" autocomplete="street-address" data-i18n-placeholder="co.addressPh" aria-describedby="address-err"></textarea>
            <p id="address-err" class="field-error"></p>
          </div>
          <div class="field" id="pointField" hidden>
            <label for="point" data-i18n="co.point"></label>
            <select id="point" name="point" class="select" aria-describedby="point-err"></select>
            <p id="point-err" class="field-error"></p>
          </div>
        </fieldset>

        <fieldset class="co-section">
          <legend><span class="step-no" aria-hidden="true">03</span><span data-i18n="co.payment"></span></legend>
          <div class="check-list pay-list">
            <label class="check"><input type="radio" name="payment" value="cash" checked> <span data-i18n="pay.cash"></span></label>
            <label class="check"><input type="radio" name="payment" value="card"> <span data-i18n="pay.card"></span></label>
            <label class="check"><input type="radio" name="payment" value="link"> <span data-i18n="pay.link"></span></label>
          </div>
          <p class="hint" data-i18n="co.payNote"></p>
        </fieldset>

        <fieldset class="co-section">
          <legend><span class="step-no" aria-hidden="true">04</span><span data-i18n="co.step.comment"></span></legend>
          <div class="field">
            <label for="comment" data-i18n="co.comment"></label>
            <textarea id="comment" name="comment" class="input" rows="3" maxlength="300" aria-describedby="comment-count"></textarea>
            <p id="comment-count" class="hint"></p>
          </div>
        </fieldset>

        <fieldset class="co-section">
          <legend><span class="step-no" aria-hidden="true">05</span><span data-i18n="co.step.confirm"></span></legend>
          <div class="field">
            <label class="check"><input type="checkbox" id="agree" name="agree" aria-describedby="agree-err"> <span data-i18n="co.agree"></span></label>
            <p id="agree-err" class="field-error"></p>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-block" id="placeBtn"></button>
      </form>

      <aside class="summary" aria-labelledby="coSummaryTitle">
        <h2 id="coSummaryTitle" data-i18n="co.summary"></h2>
        <ul id="coLines" class="mini-lines"></ul>
        <dl id="coTotals" class="totals"></dl>
        <a href="cart.html" class="back-link" data-i18n="co.edit"></a>
      </aside>
    </div>

    <section id="done" class="done" hidden aria-labelledby="doneTitle">
      <h2 id="doneTitle" tabindex="-1"></h2>
      <p id="doneText"></p>
      <div class="hero-actions">
        <a id="doneOrders" class="btn" href="orders.html" data-i18n="done.orders"></a>
        <a class="btn btn-ghost" href="catalog.html" data-i18n="done.shop"></a>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <div id="toasts" class="toast-host"></div>
</body>
</html>
